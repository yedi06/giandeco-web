<meta property="og:type" content="website">

<meta property="og:description" content="Iluminación Giandeco: colgantes individuales, múltiples y lineales con ficha técnica y precio. Entrega en Lima y Callao.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Jost:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/giandeco.css?v=12">
<link rel="stylesheet" href="css/gd-tienda.css?v=6">
<link rel="stylesheet" href="css/gd-movil.css?v=1">
<link rel="stylesheet" href="css/gd-tema.css?v=1">
<script src="js/gd-tema.js?v=1"></script>
<style>
  .mb-filtros{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:var(--sp-40); }
  .mb-filtro{
    appearance:none; background:none; cursor:pointer; border:1px solid rgba(10,9,6,.16); border-radius:2px;
    padding:9px 16px; font-family:var(--body); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--grafito); transition:border-color .25s ease, color .25s ease, background-color .25s ease;
  }
  .mb-filtro:hover{ border-color:var(--bronce); color:var(--bronce); }
  .mb-filtro.is-active{ background:var(--ebano); border-color:var(--ebano); color:var(--humo); }
  .mb-vacio{ color:var(--grafito); font-size:.92rem; }
</style>
</head>
<body data-mundo="catalogo" data-seccion="iluminacion">

<div id="gdHeader"></div>

<section class="gd-hero is-corto">
  <div class="gd-hero-panel">
    <p class="gd-migas reveal-left"><a href="./">Inicio</a> / <a href="catalogo">Catálogo</a> / <span>Iluminación</span></p>
    <p class="gd-hero-eyebrow reveal-left"><i></i>Luz con ficha técnica</p>
    <h1 class="reveal-left d1">Iluminación</h1>
    <p class="reveal-left d2">Nueve colgantes con ficha técnica y precio. Individuales, múltiples y lineales — la luz que ya especificamos en obra.</p>
  </div>
  <div class="gd-hero-media">
    <div class="gd-curtain"><img decoding="async" class="gd-kb-img" src="images/iluminacion/lara-1.jpg" alt="Lámpara Lara Black, aro circular LED sobre mesa de comedor"></div>
    <div class="gd-hero-cap">
      <span><b>Colgante individual</b><span>Lámpara Lara Black</span></span>
      <span class="gd-scroll-cue" aria-hidden="true">Desplace<i></i></span>
    </div>
  </div>
</section>

<section class="gd-sec gd-claro">
  <div class="gd-in">
    <div class="mb-filtros reveal" id="mbFiltros"></div>
    <div class="gd-grid" id="mbGrid"></div>
  </div>
</section>

<div id="gdFooter"></div>
<script src="js/giandeco.js?v=15"></script>
<script>
(function(){
  var P = window.GD_ILUMINACION || {};
  var keys = Object.keys(P);
  var grid = document.getElementById('mbGrid');
  var filtros = document.getElementById('mbFiltros');
  if(!grid) return;

  var cats = ['Todo'];
  keys.forEach(function(k){ if(cats.indexOf(P[k].cat) === -1) cats.push(P[k].cat); });

  filtros.innerHTML = cats.map(function(c, i){
    return '<button type="button" class="mb-filtro' + (i === 0 ? ' is-active' : '') + '" data-cat="' + c + '">' + c + '</button>';
  }).join('');

  function pintar(cat){
    var lista = keys.filter(function(k){ return cat === 'Todo' || P[k].cat === cat; });
    grid.innerHTML = lista.length ? lista.map(function(k, i){
      var p = P[k];
      var d = i < 4 ? '' : (i < 8 ? ' d1' : ' d2');
      return '<a class="gd-prod reveal' + d + '" href="' + GD_URL(k) + '" data-cursor="Ver">' +
        '<span class="gd-prod-thumb">' +
          (p.precio === 'Consultar' ? '<span class="gd-prod-badge">A consultar</span>' : '') +
          '<img decoding="async" src="' + p.img + '" alt="' + p.nombre + '" loading="lazy">' +
        '</span>' +
        '<span class="gd-prod-cat">' + p.cat + '</span>' +
        '<span class="gd-prod-name">' + p.nombre + '</span>' +
        '<span class="gd-prod-price">' + p.precio + '</span>' +
      '</a>';
    }).join('') : '<p class="mb-vacio">Sin piezas en esta categoría por ahora.</p>';
    grid.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  }

  filtros.addEventListener('click', function(e){
    var b = e.target.closest('.mb-filtro'); if(!b) return;
    filtros.querySelectorAll('.mb-filtro').forEach(function(x){ x.classList.remove('is-active'); });
    b.classList.add('is-active');
    pintar(b.dataset.cat);
  });


  pintar('Todo');
  var hash = (location.hash || '').replace('#','');
  if(hash && P[hash]) location.replace(GD_URL(hash));
})();
</script>
<script src="js/gd-tienda.js?v=7" defer></script>
<script src="js/gd-movil.js?v=1" defer></script>
<script src="js/gd-chat.js?v=11" defer></script>
</body>
</html>
