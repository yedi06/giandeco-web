    }
    return '<div class="op-grid"><div><p class="gd-eyebrow">Opiniones verificadas</p><h2 class="gd-h2" style="font-size:clamp(1.9rem,3vw,2.4rem);">Solo opina quien compró</h2>' +
        '<ul class="op-regla"><li>Cada opinión está vinculada a un número de pedido.</li><li>Se califica lo que importa en una pieza para su espacio: acabado, fidelidad a la foto, entrega y atención.</li><li>El estudio la revisa antes de publicarla y no edita su contenido.</li></ul></div>' +
      '<div>' + (res || '<p class="gd-body">Esta pieza todavía no tiene opiniones publicadas.</p>') + caja + '</div></div>';
  }

  /* ==================== 6b. PREGUNTAS AL ESTUDIO ==================== */
  var preg = T.CFG.PREGUNTAS.filter(function(q){ return q.producto === key; });
  var pregHTML = '<section class="gdt-sec" id="preguntas"><div class="op-grid"><div><p class="gd-eyebrow">Preguntas sobre esta pieza</p>' +
      '<h2 class="gd-h2" style="font-size:clamp(1.9rem,3vw,2.4rem);">Pregúntele a un diseñador</h2>' +
      '<p class="gd-body">Medidas, acabados, si combina con lo que ya tiene. Responde una persona del estudio, no un robot.</p></div>' +
    '<div>' + (preg.length ? preg.map(function(q){
        return '<article class="op-item"><p style="color:var(--lino);font-weight:500;margin-bottom:8px;">' + esc(q.p) + '</p><p>' + esc(q.r) + '</p><span class="op-sello">Responde el estudio</span></article>';
      }).join('') : '') +
      '<form class="op-caja gd-form" id="pgForm" novalidate>' +
        '<div class="gd-field"><label for="pgTexto">Su pregunta</label><textarea id="pgTexto" style="min-height:96px;" placeholder="¿Entra en un ambiente de 3 × 4 m? ¿Viene en otro acabado?"></textarea><span class="gdt-err">Escriba su pregunta.</span></div>' +
        '<button type="submit" class="gd-btn gd-btn-primary" style="justify-self:start;">Enviar pregunta' + T.FLECHA + '</button>' +
        '<p class="gd-form-nota">Se abre WhatsApp con su pregunta y el nombre de la pieza ya escritos.</p>' +
      '</form></div></div></section>';

  /* ==================== 7. SIMILARES Y VISTOS ==================== */
  var sim = T.similares(key, 4);
  var simHTML = sim.length ? '<section class="gdt-sec"><div class="gdt-sec-head"><div><p class="gd-eyebrow">' + L.label + '</p><h2 class="gd-h2">También en esta línea</h2></div>' +
    '<a class="gd-link" href="' + L.href + '">Ver la colección' + T.FLECHA + '</a></div>' +
    '<div class="gd-grid">' + sim.map(function(k){ return T.card(k); }).join('') + '</div></section>' : '';

  var vis = T.vistos.lista().filter(function(k){ return k !== key && sim.indexOf(k) === -1; }).slice(0, 4);
  var visHTML = vis.length ? '<section class="gdt-sec"><div class="gdt-sec-head"><div><p class="gd-eyebrow is-muted">Su recorrido</p><h2 class="gd-h2">Vistas hace poco</h2></div></div>' +
    '<div class="gd-grid">' + vis.map(function(k){ return T.card(k, { sinBoton:true }); }).join('') + '</div></section>' : '';
  T.vistos.marcar(key);

  root.innerHTML = top + '<div class="gd-in">' + ficha + guia + set + estudio +
    pregHTML + '<section class="gdt-sec" id="opiniones">' + opinionesHTML() + '</section>' + simHTML + visHTML + '</div>' +
    '<div class="pdp-bar" id="pdpBar"><span><b>' + esc(p.nombre) + '</b><i>' + esc(p.precio) + '</i></span>' +
      (p.stock <= 0 ? '' : '<button type="button" class="gd-btn gd-btn-primary" data-gdt-add="' + key + '">' + (consulta ? 'Cotizar' : 'Añadir') + '</button>') + '</div>';

  /* ==================== COMPORTAMIENTO ==================== */
  var plate = document.getElementById('pdpPlate'), img = document.getElementById('pdpImg');
  var fino = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  function ajustar(){
    var w = img.naturalWidth, h = img.naturalHeight; if(!w) return;
    plate.style.aspectRatio = String(Math.max(.8, Math.min(1, w / h)));
    var chica = w < 500;
    plate.classList.toggle('is-chica', chica);
    img.style.width = chica ? Math.min(w * 2, 520) + 'px' : '';
    img.style.maxWidth = chica ? '86%' : '';
    plate.classList.toggle('is-zoom', fino && w >= 800);
  }
  img.addEventListener('load', ajustar); if(img.complete) ajustar();
  plate.addEventListener('mousemove', function(e){
    if(!plate.classList.contains('is-zoom')) return;
    var r = plate.getBoundingClientRect();
    img.style.transformOrigin = ((e.clientX - r.left) / r.width * 100) + '% ' + ((e.clientY - r.top) / r.height * 100) + '%';
  });
  root.querySelectorAll('.pdp-thumb').forEach(function(b){
    b.addEventListener('click', function(){
      root.querySelectorAll('.pdp-thumb').forEach(function(x){ x.classList.toggle('is-active', x === b); });
      img.src = b.getAttribute('data-src');
    });
  });

  var qty = 1, add = document.getElementById('pdpAdd'), qtyEl = document.getElementById('pdpQty');
  root.querySelectorAll('[data-pdp-qty]').forEach(function(b){
    b.addEventListener('click', function(){
      qty = Math.max(1, Math.min(p.stock, 99, qty + parseInt(b.getAttribute('data-pdp-qty'), 10)));
      qtyEl.textContent = qty; add.setAttribute('data-qty', qty);
    });
  });
  var ya = document.getElementById('pdpYa');
  if(ya) ya.addEventListener('click', function(){ T.carrito.addKey(key, qty); location.href = 'checkout'; });
  var setBtn = document.getElementById('pdpSet');
  if(setBtn) setBtn.addEventListener('click', function(){ conjunto.forEach(function(k){ T.carrito.addKey(k, 1); }); T.abrir(); });

  /* calculadora de proporción */
  var cIn = document.getElementById('pdpCalc'), cOut = document.getElementById('pdpCalcOut');
  function calcular(){
    var v = parseFloat(cIn.value);
    if(!v){ cOut.textContent = ''; return; }
    if(G.calc === 'mesa'){
      var a = Math.round(v / 2 / 5) * 5, b = Math.round(v * 2 / 3 / 5) * 5;
      var h = 'Para una mesa de ' + v + ' cm: lámpara de <b>' + a + ' a ' + b + ' cm</b> de ancho, suspendida entre <b>75 y 90 cm</b> sobre el tablero.';
      if(p.linea === 'iluminacion' && p.largo){
        h += '<em>Esta pieza mide ' + p.largo + ' cm: ' + (p.largo < a ? 'queda corta para esa mesa.' : p.largo > b ? 'queda larga para esa mesa.' : 'está en proporción.') + '</em>';
      } else if(p.linea === 'muebleria'){
        var ok = Object.keys(T.CAT).filter(function(k){ var q = T.CAT[k]; return q.linea === 'iluminacion' && q.largo >= a && q.largo <= b; })[0];
        if(ok) h += '<em><a href="' + T.url(ok) + '" style="color:inherit;">' + esc(T.CAT[ok].nombre) + ' (' + T.CAT[ok].largo + ' cm)</a> entra en esa proporción.</em>';
      }
      cOut.innerHTML = h;
    } else {
      var d1 = (v * 2.54 * 1.2 / 100).toFixed(1), d2 = (v * 2.54 * 1.6 / 100).toFixed(1);
      cOut.innerHTML = 'Con una pantalla de ' + v + '": siéntese entre <b>' + d1 + ' y ' + d2 + ' m</b> de distancia.' +
        (p.tv ? '<em>' + (v > p.tv ? 'Este centro admite hasta ' + p.tv + '": su televisor no entra.' : 'Este centro admite hasta ' + p.tv + '": su televisor entra.') + '</em>' : '');
    }
  }
  if(cIn){ cIn.addEventListener('input', calcular); calcular(); }

  /* opiniones */
  root.addEventListener('submit', function(e){
    if(e.target.id === 'pgForm'){
      e.preventDefault();
      var t = e.target.querySelector('#pgTexto');
      t.parentNode.classList.toggle('is-mal', t.value.trim().length < 8);
      if(t.value.trim().length < 8){ t.focus(); return; }
      var pg = { id:T.uid(), producto:key, p:t.value.trim(), fecha:new Date().toISOString() }, pgs = T.db('preguntas') || []; pgs.unshift(pg); T.db('preguntas', pgs); T.nube('preguntas', pg.id, pg);
      window.open(T.wa('Hola Giandeco, tengo una pregunta sobre ' + p.nombre + ' (' + p.precio + '):\n\n' + t.value.trim()), '_blank', 'noopener');
      return;
    }
    if(e.target.id !== 'opForm') return;
    e.preventDefault();
    var f = e.target, notas = {}, falta = false;
    T.CRITERIOS.forEach(function(c){ var r = f.querySelector('input[name="op-' + c.k + '"]:checked'); if(r) notas[c.k] = +r.value; else falta = true; });
    var texto = f.querySelector('#opTexto'), autor = f.querySelector('#opAutor');
    texto.parentNode.classList.toggle('is-mal', texto.value.trim().length < 20);
    autor.parentNode.classList.toggle('is-mal', !autor.value.trim());
    if(falta){ f.querySelector('.op-crit input:not(:checked)').focus(); return; }
    if(f.querySelector('.is-mal')){ f.querySelector('.is-mal input, .is-mal textarea').focus(); return; }
    var ped = T.pedidos.conProducto(key);
    var o = { producto:key, pedido:ped.n, notas:notas, texto:texto.value.trim(), ambiente:f.querySelector('#opAmb').value,
              autor:autor.value.trim(), lugar:(ped.entrega && ped.entrega.distrito) || '', publicar:f.querySelector('#opPub').checked };
    T.opiniones.guardar(o);
    window.open(T.wa(T.opiniones.mensaje(o)), '_blank', 'noopener');
    document.getElementById('opiniones').innerHTML = opinionesHTML();
  });

  /* barra fija en móvil: aparece cuando el botón principal sale de pantalla */
  var bar = document.getElementById('pdpBar');
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(en){ bar.classList.toggle('is-in', !en[0].isIntersecting && en[0].boundingClientRect.top < 0); })
      .observe(document.getElementById('pdpAcc'));
  }
  if(location.hash === '#opiniones') document.getElementById('opiniones').scrollIntoView();
})();
</script>
<script src="js/gd-movil.js?v=1" defer></script>
<script src="js/gd-chat.js?v=11" defer></script>
</body>
</html>
