<style>
  /* ============ CASOS — editorial de scroll fijo (sticky), todo visible ============
     Mismo patrón que retail-proyectos: nada se oculta, los 5 casos están
     siempre completos. La foto de cada caso queda anclada (position:sticky)
     mientras el texto avanza al lado, y se suelta al terminar ese caso. */
  .hp-item{ position:relative; border-top:1px solid var(--line); padding-block:clamp(56px,7vw,104px); }
  .hp-item:last-child{ border-bottom:1px solid var(--line); }

  .hp-grid{ position:relative; z-index:1; display:grid; grid-template-columns:1fr; gap:clamp(28px,4vw,48px); }
  @media (min-width:900px){
    .hp-grid{ grid-template-columns:1fr 1.1fr; gap:clamp(40px,5vw,72px); }
    .hp-item:nth-child(even) .hp-grid{ direction:rtl; }
    .hp-item:nth-child(even) .hp-grid > *{ direction:ltr; }
  }
  @media (min-width:900px){ .hp-visual-in{ position:sticky; top:calc(var(--h-total) + 28px); } }
  .hp-media{ position:relative; border-radius:2px; overflow:hidden; aspect-ratio:4/3; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); }
  .hp-media img{ width:100%; height:100%; object-fit:cover; }
  .hp-visual-cap{ display:flex; align-items:baseline; gap:14px; margin-top:18px; }
  .hp-num{ font-family:var(--display); font-weight:400; font-size:clamp(1.1rem,1.6vw,1.35rem); color:var(--accent); flex:none; }
  .hp-cat{ font-family:var(--body); font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--text-faint); }

  .hp-nombre{ font-family:var(--display); font-weight:400; font-size:clamp(2rem,3.4vw,2.7rem); color:var(--lino); margin:0 0 clamp(24px,3vw,36px); line-height:1.05; }

  .hp-stepper{ display:flex; align-items:center; margin-bottom:clamp(24px,3vw,34px); flex-wrap:wrap; row-gap:10px; }
  .hp-step{ display:flex; align-items:center; gap:8px; flex:none; }
  .hp-step b{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--accent); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-family:var(--body); font-size:.6rem; flex:none;
  }
  .hp-step span{ font-family:var(--body); font-size:.72rem; color:var(--text-faint); white-space:nowrap; }
  .hp-step-line{ flex:1 1 20px; height:1px; background:var(--line); margin:0 10px; min-width:16px; }

  .hp-bloque{ margin-bottom:20px; }
  .hp-bloque b{ display:block; font-family:var(--body); font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--text-faint); margin-bottom:8px; }
  .hp-bloque p{ margin:0; color:var(--text-dim); font-size:1rem; line-height:1.75; max-width:52ch; }

  .hp-quote-wrap{ margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }
  .hp-quote-label{ display:block; font-family:var(--body); font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
  .hp-quote{
    margin:0; font-family:var(--script); font-style:italic; font-weight:300;
    font-size:clamp(1.2rem,1.7vw,1.4rem); line-height:1.5; color:var(--lino); max-width:44ch;
  }
  .hp-quote::before{ content:'“'; color:var(--accent); font-family:var(--display); font-style:normal; margin-right:2px; }
</style>
</head>
<body data-mundo="hogar" data-seccion="proyectos">

<div id="gdHeader"></div>

<section class="gd-hero is-corto">
  <div class="gd-hero-panel">
    <p class="gd-migas reveal-left"><a href="./">Inicio</a> / <a href="hogar">Hogar</a> / <span>Proyectos</span></p>
    <p class="gd-hero-eyebrow reveal-left"><i></i>Historias, no solo fotos</p>
    <h1 class="reveal-left d1">Interiorismo, arte y <em>arquitectura efímera</em></h1>
    <p class="reveal-left d2">Espacios donde el encargo no era vender un producto, sino sostener una atmósfera.</p>
  </div>
  <div class="gd-hero-media">
    <div class="gd-curtain"><img decoding="async" class="gd-kb-img" src="images/espacios/casacor-1.jpg?v=2" alt="Ambiente presentado en Casacor 2025"></div>
    <div class="gd-hero-cap">
      <span><b>Ambiente de feria</b><span>Casacor 2025</span></span>
      <span class="gd-scroll-cue" aria-hidden="true">Desplace<i></i></span>
    </div>
  </div>
</section>

<section class="gd-sec">
  <div class="gd-in" id="hpLista"></div>
</section>

<section class="gd-sec gd-claro" style="padding-block:clamp(48px,6vw,80px);">
  <div class="gd-in" style="text-align:center;">
    <h2 class="gd-h2 reveal" style="margin-inline:auto; max-width:22ch;">¿Empezamos por su espacio?</h2>
    <div class="reveal d1" style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:var(--sp-24);">
      <a class="gd-btn gd-btn-primary" href="contacto">Agendar visita técnica
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
      <a class="gd-btn gd-btn-ghost" href="hogar-espacios">Ver espacios</a>
    </div>
  </div>
</section>

<div id="gdFooter"></div>
<script src="js/giandeco.js?v=15"></script>
<script>
(function(){
  var CASOS = [
    { slug:'convivir-con-el-arte', cat:'Arte · interiorismo', nombre:'Convivir con el Arte', img:'images/work/convivir.jpg',
      reto:'Diseñar un espacio que no le quitara protagonismo al arte que exhibía.',
      hice:'Conceptualizamos un espacio de inspiración ecléctica con techo en azul profundo, zócalos en verde oliva e iluminación cálida indirecta. Mobiliario de líneas orgánicas y curaduría de piezas de gran formato junto a textiles bordados e iluminación focalizada, para una atmósfera pensada para la conversación.',
      res:'Nuevos encargos de decoración de interiores.' },
    { cat:'Mobiliario y decoración', nombre:'Casa Grande', img:'images/proyectos/casagrande-1.jpg?v=2',
      reto:'Que el cliente se imaginara viviendo en los ambientes exhibidos, no solo viendo muebles.',
      hice:'Creamos ambientes inmersivos tipo vignette dentro del piso de venta, recreando dormitorios, salas y comedores completos. Paletas por zona combinando maderas nobles, terciopelos, lino y metalizados, con curaduría de arte mural, plantas e iluminación de acento.',
      res:'Más ventas, más afluencia y más movimiento en redes sociales.' },
    { cat:'Hotelería · restaurante', nombre:'Hotel Unión Cusco', img:'images/work/unioncusco.jpg',
      reto:'Que el restaurante del hotel contara una historia de identidad local, no solo sirviera mesas.',
      hice:'Renovación integral bajo el concepto Raíces: origen, artesanía local y gastronomía inmersiva. Lencería blanca de alta gama con textiles tradicionales y vajilla artesanal, y repisas y escaleras en madera rústica para exhibir insumos locales y licores de la casa.',
      res:'Interés nacional e internacional. Hoy es referente frente a la competencia.' },
    { slug:'walon-35-anos', cat:'Evento corporativo', nombre:'Walon · 35 años', img:'images/proyectos/walon35-salon.jpg',
      reto:'Narrar 35 años de historia de marca en una sola noche de evento.',
      hice:'Diseñamos y ejecutamos la arquitectura efímera del aniversario: desde la experiencia de bienvenida, con arcos de acceso e integración floral, hasta la exhibición vivencial de producto con iluminación focalizada y juegos de textura. Del mobiliario a la distribución de mesas, todo pensado para guiar el flujo de invitados.',
      res:'Fuerte repercusión en redes y cobertura de influencers.',
      enlace:{ href:'evento-walon35', label:'Ver los tres momentos de la noche' } },
    { slug:'casacor-2025', cat:'Feria de diseño de interiores', nombre:'Casacor 2025', img:'images/proyectos/casacor-3.jpg',
      reto:'Presentar en un stand que se visita una sola vez el mismo nivel de detalle de un proyecto permanente.',
      hice:'Diseñé un ambiente de sala completo para el recorrido de Casacor: cornisa con iluminación indirecta LED, revestimiento texturado, curaduría de cuadros con luz dirigida y una paleta de azules y verdes sobre lino. Cada rincón pensado para leerse en segundos y sostenerse de cerca en fotografía.',
      res:'Presencia en la feria de diseño de interiores de referencia del país.' },
    { slug:'expodeco-2024', cat:'Feria de decoración', nombre:'Expodeco 2024', img:'images/espacios/expodeco-1.png',
      reto:'Montar en un stand de feria la propuesta completa de Decopapel, marca de revestimientos y papel mural.',
      hice:'Concebí el recorrido del stand por categoría: muro de exhibición de rollos y revestimientos, arco fotográfico iluminado, vegetación colgante y zona lounge con mobiliario curado — pensado para funcionar como showroom, no solo como stand de feria.',
      res:'Presencia en la feria de decoración de referencia del país.' }
  ];

  var cont = document.getElementById('hpLista');
  if(!cont) return;
  var PROCESO = [
    { n:'01', label:'Visita técnica' },
    { n:'02', label:'Concepto y moodboard' },
    { n:'03', label:'Montaje en obra' },
    { n:'04', label:'Entrega y seguimiento' }
  ];
  function stepperHTML(){
    return '<div class="hp-stepper">' + PROCESO.map(function(s, i){
      var linea = i < PROCESO.length - 1 ? '<span class="hp-step-line" aria-hidden="true"></span>' : '';
      return '<span class="hp-step"><b>' + s.n + '</b><span>' + s.label + '</span></span>' + linea;
    }).join('') + '</div>';
  }

  // todos los casos van siempre completos y visibles — nada se oculta.
  cont.innerHTML = CASOS.map(function(c, i){
    var num = '0' + (i + 1);
    return '<article class="hp-item"' + (c.slug ? ' id="' + c.slug + '"' : '') + '>' +
      '<div class="hp-grid">' +
        '<div class="hp-visual"><div class="hp-visual-in">' +
          '<div class="hp-media reveal-scale gd-curtain"><img decoding="async" class="gd-kb-img" src="' + c.img + '" alt="' + c.nombre + ' — ' + c.cat + '" loading="lazy"></div>' +
          '<div class="hp-visual-cap"><span class="hp-num">' + num + '</span><span class="hp-cat">' + c.cat + '</span></div>' +
        '</div></div>' +
        '<div class="reveal d1">' +
          '<h2 class="hp-nombre">' + c.nombre + '</h2>' +
          stepperHTML() +
          '<div class="hp-bloque"><b>Reto</b><p>' + c.reto + '</p></div>' +
          '<div class="hp-bloque"><b>Qué hicimos</b><p>' + c.hice + '</p></div>' +
          '<div class="hp-quote-wrap"><span class="hp-quote-label">Resultado</span><p class="hp-quote">' + c.res + '</p></div>' +
          (c.enlace ? '<a class="gd-link" style="margin-top:18px;" href="' + c.enlace.href + '">' + c.enlace.label +
            '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>' : '') +
        '</div>' +
      '</div>' +
    '</article>';
  }).join('');

  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(en){
      en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('is-visible'); io.unobserve(e.target); } });
    }, { threshold:.12, rootMargin:'0px 0px -6% 0px' });
    cont.querySelectorAll('.reveal, .reveal-scale, .gd-curtain').forEach(function(el){ io.observe(el); });
  } else {
    cont.querySelectorAll('.reveal, .reveal-scale, .gd-curtain').forEach(function(el){ el.classList.add('is-visible'); });
  }
})();
</script>
<script src="js/gd-tienda.js?v=6" defer></script>
<script src="js/gd-movil.js?v=1" defer></script>
<script src="js/gd-chat.js?v=11" defer></script>
</body>
