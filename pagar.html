<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<base href="/"><script>if(/\.github\.io$/.test(location.hostname))document.querySelector("base").href="/"+location.pathname.split("/")[1]+"/";window.addEventListener("click",function(e){if(e.defaultPrevented)return;var a=e.target.closest&&e.target.closest("a[href^='#']");if(a&&a.getAttribute("href").length>1){e.preventDefault();location.hash=a.getAttribute("href")}})</script>
<script src="js/gd-acceso.js?v=20261018a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagar mi pedido — Giandeco Studio Design</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0A0A09">
<!-- favicon -->
<link rel="icon" href="favicon.ico?v=1" sizes="32x32">
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="site.webmanifest?v=1">
<!-- /favicon -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Jost:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/giandeco.css?v=20261103q">
<link rel="stylesheet" href="css/gd-tienda.css?v=20261103n">
<link rel="stylesheet" href="css/gd-tema.css?v=20261026r">
<script src="js/gd-tema.js?v=20261018a"></script>
</head>
<!-- Misma cabecera sobria del checkout: nada que distraiga de pagar. -->
<body data-home="true" class="co-body">

<header class="co-head">
  <a class="co-head-volver" href="cuenta#pedidos"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg>Mis pedidos</a>
  <a class="co-head-logo" href="./" aria-label="Giandeco Studio Design"><img src="img/logo-negativo.svg" alt="Giandeco Studio Design"></a>
  <span class="co-head-seguro"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Pago seguro</span>
</header>

<main class="co-top"><div class="gd-in"><div class="pg" id="pg" aria-live="polite"></div></div></main>

<footer class="co-foot">
  <a href="ayuda/compra-segura" target="_blank">Compra segura</a>
  <a href="ayuda/envios-y-entregas" target="_blank">Envíos</a>
  <a href="ayuda/cambios-y-garantia" target="_blank">Cambios y garantía</a>
  <a href="legal/terminos-y-condiciones" target="_blank">Términos</a>
  <a href="legal/politica-de-privacidad" target="_blank">Privacidad</a>
  <a href="legal/libro-de-reclamaciones" target="_blank">Libro de reclamaciones</a>
</footer>

<script src="js/giandeco.js?v=20261103m"></script>
<script src="js/gd-tienda.js?v=20261103n"></script>
<script src="js/gd-pago.js?v=20261103a"></script>
<script src="js/gd-tupay.js?v=20261103b"></script>
<script>
(function(){
  var T = window.GD_TIENDA, P = window.GD_PAGO, TP = window.GD_TUPAY, esc = T.esc;
  var root = document.getElementById('pg');
  var n = (new URLSearchParams(location.search).get('n') || '').trim().toUpperCase();
  var local = n ? T.pedidos.get(n) : null, cel = local ? local.cliente.cel : '';
  var c = null;   // lo que el servidor dice que se debe
  /* con qué pasarela se paga: tarjeta (Izipay, formulario incrustado) o Tupay (Yape, Plin, transferencia…, en la página de Tupay) */
  var qs = new URLSearchParams(location.search);
  var tupay = qs.get('m') === 'tupay' || (qs.get('m') !== 'tarjeta' && !!local && local.pagoVia === 'tupay');
  var MEDIOS_TUPAY = T.CFG.PAGO.filter(function(m){ return m.via === 'tupay'; });
  var medioKey = qs.get('k') || (local && local.pagoVia === 'tupay' ? local.pagoKey : '');
  var M = tupay ? MEDIOS_TUPAY.filter(function(m){ return m.key === medioKey; })[0] || null : null;   // medio que se abre directo en Tupay (Yape, Plin…)
  var vuelta = tupay && qs.get('r') === '1', fallo = tupay && qs.get('e') === '1';   // el cliente vuelve de Tupay (pagó, o hubo un error)

  function money(cent){ return T.fmt(cent / 100); }
  function waBtn(texto, msg, clase){
    return '<a class="gd-btn ' + (clase || 'gd-btn-ghost') + '" href="' + T.wa(msg) + '" target="_blank" rel="noopener">' + texto + T.FLECHA + '</a>';
  }
  function cabecera(eyebrow, titulo){
    return '<p class="gd-eyebrow">' + eyebrow + '</p><h1>' + titulo + '</h1>' + (n ? '<p class="co-ok-n">' + esc(n) + '</p>' : '');
  }
  function resumen(){
    var d = c && c.desglose;
    if(!d || !c.items) return '';
    return '<aside class="co-res pg-res" aria-label="Resumen del pedido">' +
      '<h2>Su pedido</h2><ul class="gdt-lines">' + c.items.map(linea).join('') + '</ul>' +
      '<dl class="co-tot">' + fila('Subtotal', money(d.subtotal)) + (d.descuento ? fila('Descuento', '− ' + money(d.descuento)) : '') +
        fila(c.recojo ? 'Recojo en Giandeco' : 'Envío', d.envio ? money(d.envio) : 'Sin costo') + (d.armado ? fila('Armado / instalación', money(d.armado)) : '') +
        fila('Total a pagar', money(c.monto), 'es-total') + (T.CFG.PRECIOS_CON_IGV ? fila('Incluye IGV (18 %)', money(c.monto * 18 / 118), 'es-igv') : '') + '</dl>' +
    '</aside>';
  }
  /* los mensajes (pagado, en verificación, etc.) usan la misma rejilla que el checkout y el formulario de pago */
  function estado(dentro, conResumen){
    return '<div class="co-grid pg-grid"><section class="pg-pago pg-estado">' + dentro + '</section>' + (conResumen ? resumen() : '') + '</div>';
  }
  function enlaces(){
    return '<div class="co-ok-acc" style="margin-top:var(--sp-40);"><a class="gd-btn gd-btn-ghost" href="cuenta#pedidos">Ver mis pedidos</a>' +
      '<a class="gd-link" href="seguimiento?n=' + encodeURIComponent(n) + '" style="align-self:center;">Seguir este pedido' + T.FLECHA + '</a></div>';
  }

  /* ---------- sin número, o pedido hecho en otro dispositivo ---------- */
  function pedirDatos(aviso){
    simple();
    root.innerHTML = '<p class="gd-eyebrow">Pago en línea</p><h1>Pagar mi pedido</h1>' + estado(
      '<p class="co-lead">Escriba el número de su pedido y el celular con el que lo registró.</p>' +
      '<form class="gd-form" id="pgForm" novalidate>' +
        '<div class="gd-field"><label for="pgN">Número de pedido</label><input id="pgN" type="text" placeholder="GD-000000-0000" autocomplete="off" value="' + esc(n) + '"><span class="gdt-err">Escriba el número completo, por ejemplo GD-261007-1234.</span></div>' +
        '<div class="gd-field"><label for="pgCel">Celular</label><input id="pgCel" type="tel" inputmode="numeric" maxlength="9" placeholder="9XX XXX XXX" autocomplete="tel-national"><span class="gdt-err">Celular de 9 dígitos que empiece en 9.</span></div>' +
        (aviso ? '<p class="gdt-err" style="display:block;">' + aviso + '</p>' : '') +
        '<button type="submit" class="gd-btn gd-btn-primary" style="justify-self:start;">Continuar' + T.FLECHA + '</button></form>');
    document.getElementById('pgForm').addEventListener('submit', function(e){
      e.preventDefault();
      var a = document.getElementById('pgN'), b = document.getElementById('pgCel');
      var vn = a.value.trim().toUpperCase(), vc = b.value.replace(/\D/g, '');
      var okN = /^GD-\d{6}-\d{4}$/.test(vn), okC = /^9\d{8}$/.test(vc);
      a.closest('.gd-field').classList.toggle('is-mal', !okN); b.closest('.gd-field').classList.toggle('is-mal', !okC);
      if(!okN || !okC) return;
      n = vn; cel = vc; local = T.pedidos.get(n);
      history.replaceState(null, '', 'pagar?n=' + encodeURIComponent(n) + (tupay ? '&m=tupay' + (M ? '&k=' + M.key : '') : ''));
      consultar(0);
    });
  }

  /* ---------- pedido que todavía no se puede pagar aquí ---------- */
  var PORQUE = {
    'envio':   ['Giandeco confirma el envío', 'Su pedido está registrado. En cuanto Giandeco confirme el costo de envío a su dirección, podrá pagarlo en esta misma página.'],
    'armado':  ['Giandeco cotiza el armado', 'Su pedido está registrado. En cuanto Giandeco le confirme el costo de armado o instalación, podrá pagarlo en esta misma página.'],
    'cotizar': ['Giandeco confirma su pedido', 'Su pedido incluye piezas que Giandeco cotiza. Cuando reciba el detalle, coordinamos el pago con usted.'],
    'monto':   ['Coordinemos el pago', 'Por su monto, este pedido se paga coordinando directamente con Giandeco.'],
    'cerrado': ['Pedido cerrado', 'Este pedido ya no admite pagos. Si cree que es un error, escríbanos.'],
    'sin-pasarela': ['Coordinemos el pago', 'Su pedido está registrado. Giandeco le enviará los datos para pagar con el medio que eligió.']
  };
  function noPagable(motivo){
    simple();
    var t = PORQUE[motivo] || PORQUE['sin-pasarela'];
    root.innerHTML = cabecera('Pedido registrado', t[0]) + estado('<p class="co-lead">' + t[1] + '</p>' +
      '<div class="co-ok-acc">' + waBtn('Escribir a Giandeco', local ? T.pedidos.mensaje(local) : 'Hola Giandeco, quiero coordinar el pago de mi pedido ' + n + '.', 'gd-btn-primary') + '</div>' + enlaces(), true);
  }

  /* ---------- pagado ---------- */
  function pagado(p){
    simple();
    if(local && !local.pagado){ var l = T.pedidos.lista(); l.forEach(function(x){ if(x.n === n) x.pagado = true; }); T.db('pedidos', l); }
    var con = p && p.medio === 'yape' ? 'Yape' : p && p.ultimos4 ? (p.marca ? esc(p.marca) + ' ' : 'Tarjeta ') + 'terminada en ' + esc(p.ultimos4) : p && p.marca ? esc(p.marca) : '';
    root.innerHTML = cabecera('Pago recibido', 'Gracias' + (c && c.cliente && c.cliente.nombre ? ', ' + esc(c.cliente.nombre) : '')) + estado(
      '<p class="co-lead">Recibimos su pago' + (p && p.monto ? ' de <b style="color:var(--lino);">' + money(p.monto) + '</b>' : '') + (con ? ' con ' + con : '') + '. ' +
        'Giandeco prepara su pedido y le escribe para coordinar la entrega. Su comprobante electrónico llega a su correo.</p>' +
      (p && p.ref ? '<p class="gd-form-nota">Referencia del pago: ' + esc(p.ref) + '</p>' : '') +
      '<div class="co-ok-acc" style="margin-top:var(--sp-24);">' + waBtn('Avisar a Giandeco', 'Hola Giandeco, acabo de pagar en línea mi pedido ' + n + '.', 'gd-btn-primary') + '</div>' + enlaces(), true);
  }

  /* ---------- listo para pagar ---------- */
  function fila(dt, dd, clase){ return '<div' + (clase ? ' class="' + clase + '"' : '') + '><dt>' + dt + '</dt><dd>' + dd + '</dd></div>'; }
  function linea(x){
    var p = x.key ? T.CAT[x.key] : null;
    return '<li class="gdt-line">' + (p && p.img ? '<span class="gdt-line-img"><img decoding="async" src="' + esc(p.img) + '" alt=""></span>' : '<span class="gdt-line-img is-vacia" aria-hidden="true">G</span>') +
      '<div class="gdt-line-body">' + (p ? '<span class="gdt-line-cat">' + esc(p.cat) + '</span>' : '') + '<span class="gdt-line-name">' + esc(x.nombre) + '</span>' +
      '<div class="gdt-line-row"><span class="gdt-qty"><b>' + x.qty + '</b></span><span class="gdt-line-price">' + (x.importe ? money(x.importe) : '') + '</span></div></div></li>';
  }
  function listo(aviso){
    var d = c.desglose;
    root.classList.add('es-pago');
    root.innerHTML =
      '<p class="gd-eyebrow">Pago en línea</p><h1>Pagar mi pedido</h1>' +
      '<p class="pg-meta"><span class="co-ok-n">' + esc(n) + '</span>' + (c.prueba ? '<span class="pg-prueba">Modo de prueba · no se realizan cobros reales</span>' : '') + '</p>' +
      '<div class="co-grid pg-grid">' +
        '<section class="pg-pago" aria-labelledby="pgT">' +
          '<h2 class="pg-t" id="pgT">Datos de pago</h2>' +
          '<p class="co-ayuda">Complete los datos de su tarjeta. Se procesan en un formulario cifrado: Giandeco no ve ni guarda los datos de su tarjeta.</p>' +
          '<div class="co-medios pg-medios"><span>Aceptamos</span>' + T.logosPago(['visa', 'mastercard', 'amex', 'diners']) + '</div>' +
          '<p class="pg-aviso" id="pgAviso" role="alert"' + (aviso ? '' : ' hidden') + '>' + (aviso ? esc(aviso) : '') + '</p>' +
          '<div class="pg-marco" id="pgMarco"><div class="pg-espera" role="status" aria-label="Cargando el formulario de pago"></div></div>' +
          '<ul class="pg-sellos">' +
            '<li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Conexión cifrada</li>' +
            '<li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>Verificación de su banco</li>' +
            '<li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>Boleta o factura a su correo</li>' +
          '</ul>' +
          '<p class="gd-form-nota">¿Prefiere pagar por depósito? ' + (local
            ? '<a href="checkout?ok=' + encodeURIComponent(n) + '&dep=1">Ver la cuenta de Giandeco</a>.</p>'
            : '<a href="' + T.wa('Hola Giandeco, quiero pagar por depósito mi pedido ' + n + '.') + '" target="_blank" rel="noopener">Pida la cuenta por WhatsApp</a>.</p>') +
        '</section>' +
        resumen() +
      '</div>';
    P.pagar({ n:n, cel:cel, cuenta:c, contenedor:'#pgMarco', alProcesar:procesando, alTerminar:resultado });
    // el aro de espera se retira cuando el formulario ya está pintado
    var caja = document.getElementById('pgMarco'), ojo = new MutationObserver(function(){
      var m = caja.querySelector('iframe'); if(!m) return;
      ojo.disconnect(); m.addEventListener('load', function(){ setTimeout(function(){ caja.classList.add('is-lista'); }, 500); });
      setTimeout(function(){ caja.classList.add('is-lista'); }, 6000);
    });
    ojo.observe(caja, { childList:true, subtree:true });
    if(aviso) document.getElementById('pgAviso').scrollIntoView({ block:'center' });
  }

  /* ---------- Tupay: listo para pagar (se paga en la página de Tupay y se vuelve aquí) ---------- */
  function listoTupay(aviso){
    var titulo = M ? 'Pagar con ' + M.label : 'Pagar con Tupay';
    function enlace(txt, href, ext){ return '<a href="' + href + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + txt + '</a>'; }
    var otros = MEDIOS_TUPAY.filter(function(m){ return m.activo && (!M || m.key !== M.key); }).map(function(m){ return enlace(esc(m.label), 'pagar?n=' + encodeURIComponent(n) + '&m=tupay&k=' + m.key); });
    otros.push(enlace('Tarjeta', 'pagar?n=' + encodeURIComponent(n) + '&m=tarjeta'));
    otros.push(local ? enlace('Pago directo', 'checkout?ok=' + encodeURIComponent(n) + '&dep=1')
                     : enlace('Pago directo', T.wa('Hola Giandeco, quiero pagar por depósito mi pedido ' + n + '.'), true));
    root.classList.add('es-pago');
    root.innerHTML =
      '<p class="gd-eyebrow">Pago en línea</p><h1>Pagar mi pedido</h1>' +
      '<p class="pg-meta"><span class="co-ok-n">' + esc(n) + '</span>' + (c.prueba ? '<span class="pg-prueba">Modo de prueba · no se realizan cobros reales</span>' : '') + '</p>' +
      '<div class="co-grid pg-grid">' +
        '<section class="pg-pago" aria-labelledby="pgT">' +
          '<h2 class="pg-t" id="pgT">' + esc(titulo) + '</h2>' +
          '<p class="co-ayuda">Se abrirá la página segura de pago. Al terminar, vuelve aquí.</p>' +
          '<p class="pg-aviso" id="pgAviso" role="alert"' + (aviso ? '' : ' hidden') + '>' + (aviso ? esc(aviso) : '') + '</p>' +
          '<button type="button" class="gd-btn gd-btn-primary pg-pagar" id="pgTupay">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Pagar ' + money(c.monto) + T.FLECHA + '</button>' +
          T.seguroPago(['tupay']).replace('class="mp-seguro"', 'class="mp-seguro es-solo"') +
          '<p class="mp-otros">Otro medio: ' + otros.join(' · ') + '</p>' +
        '</section>' +
        resumen() +
      '</div>';
    document.getElementById('pgTupay').addEventListener('click', function(){ irATupay(this); });
    if(aviso) document.getElementById('pgAviso').scrollIntoView({ block:'center' });
  }
  function avisoTupay(t){ var a = document.getElementById('pgAviso'); if(a){ a.textContent = t; a.hidden = false; a.scrollIntoView({ block:'center' }); } }
  function irATupay(boton){
    boton.disabled = true; boton.setAttribute('aria-busy', 'true');
    TP.iniciar(n, cel, M ? M.key : '').then(function(r){
      if(r && r.ok && r.pagado){ pagado(r); return; }
      if(r && r.ok && r.redirect_url){ location.href = r.redirect_url; return; }          // la página segura de Tupay
      boton.disabled = false; boton.removeAttribute('aria-busy');
      if(r && r.motivo === 'incierto'){ resultado({ motivo:'incierto' }); return; }
      if(r && r.motivo === 'en-curso'){ avisoTupay('Ya hay un pago en curso para este pedido. Espere un momento y vuelva a intentarlo.'); return; }
      if(r && r.mensaje){ avisoTupay(r.mensaje); return; }                                              // Tupay lo rechazó: se dice por qué
      if(r && r.motivo && r.motivo !== 'error' && r.motivo !== 'sin-cobro'){ consultar(0); return; }   // el pedido cambió mientras tanto
      avisoTupay((r && r.mensaje) || 'No se pudo abrir el pago. Inténtelo de nuevo en un momento.');
    });
  }
  /* vuelve de Tupay: la confirmación puede tardar unos segundos; se pregunta al servidor, que a su vez le pregunta a Tupay */
  function confirmando(intento){
    simple();
    root.innerHTML = cabecera('Pago en línea', 'Confirmando su pago') + estado(
      '<p class="co-lead">Estamos verificando su pago con Tupay. No cierre esta página.</p><div class="pg-espera" role="status" aria-label="Confirmando"></div>', true);
    TP.verificar(n, cel).then(function(r){
      if(r && r.ok && r.pagado){ pagado(r); return; }
      if(r && r.motivo === 'incierto'){ resultado({ motivo:'incierto' }); return; }
      if(r && r.motivo === 'no-pagado'){ listoTupay('El pago no se completó. Puede intentarlo de nuevo o elegir otro medio.'); return; }
      if(r && r.motivo === 'sin-cobro'){ listoTupay(''); return; }
      if(intento < 12){ setTimeout(function(){ confirmando(intento + 1); }, 4000); return; }   // hasta ~50 s
      root.innerHTML = cabecera('Pago en verificación', 'Aún no recibimos la confirmación') + estado(
        '<p class="co-lead">Si ya pagó, <b style="color:var(--lino);">no vuelva a pagar</b>: algunos medios tardan unos minutos en confirmarse y le avisamos por WhatsApp. Si no completó el pago, puede intentarlo de nuevo.</p>' +
        '<div class="co-ok-acc"><button type="button" class="gd-btn gd-btn-primary" id="pgRev">Revisar de nuevo</button>' +
        waBtn('Escribir a Giandeco', 'Hola Giandeco, pagué con Tupay mi pedido ' + n + ' y aún no se confirma.') + '</div>' + enlaces(), true);
      document.getElementById('pgRev').addEventListener('click', function(){ confirmando(0); });
    });
  }
  function simple(){ P.cerrar(); root.classList.add('es-pago'); }
  function procesando(){
    simple();
    root.innerHTML = cabecera('Pago en línea', 'Procesando su pago') + estado(
      '<p class="co-lead">No cierre ni recargue esta página. Puede tardar unos segundos.</p><div class="pg-espera" role="status" aria-label="Procesando"></div>', true);
  }
  function resultado(r){
    if(r.ok && r.pagado){ pagado(r); return; }
    if(r.motivo === 'incierto' || r.motivo === 'en-curso'){
      root.innerHTML = cabecera('Pago en verificación', 'Estamos confirmando su pago') + estado(
        '<p class="co-lead">No recibimos a tiempo la respuesta del banco. <b style="color:var(--lino);">No vuelva a pagar:</b> Giandeco verifica la operación y le confirma por WhatsApp. Si el cobro no se realizó, no se le descuenta nada.</p>' +
        '<div class="co-ok-acc">' + waBtn('Escribir a Giandeco', 'Hola Giandeco, intenté pagar en línea mi pedido ' + n + ' y quedó en verificación.', 'gd-btn-primary') + '</div>' + enlaces(), true);
      return;
    }
    if(r.cerrado){ listo(''); return; }
    if(r.motivo && r.motivo !== 'error'){ consultar(0); return; }    // el pedido cambió mientras tanto
    listo(r.mensaje || 'No se pudo completar el pago. Inténtelo de nuevo en un momento.');
  }

  /* ---------- consulta al servidor ---------- */
  function consultar(intento){
    simple();
    root.innerHTML = cabecera('Pago en línea', 'Un momento') + estado('<div class="pg-espera" role="status" aria-label="Consultando su pedido"></div>');
    (tupay ? TP : P).consulta(n, cel).then(function(r){
      // el pedido recién registrado puede tardar un instante en llegar al servidor
      if(r && !r.ok && r.motivo === 'no-encontrado' && local && intento < 5){ setTimeout(function(){ consultar(intento + 1); }, 1200); return; }
      if(!r || r.motivo === 'error'){
        root.innerHTML = cabecera('Pago en línea', 'No pudimos consultar su pedido') + estado(
          '<p class="co-lead">Revise su conexión e inténtelo de nuevo. Su pedido sigue registrado.</p>' +
          '<div class="co-ok-acc"><button type="button" class="gd-btn gd-btn-primary" id="pgOtra">Reintentar</button>' + waBtn('Escribir a Giandeco', 'Hola Giandeco, quiero pagar mi pedido ' + n + '.') + '</div>');
        document.getElementById('pgOtra').addEventListener('click', function(){ consultar(0); });
        return;
      }
      if(!r.ok){ pedirDatos('No encontramos un pedido con ese número y ese celular.'); return; }
      c = r;
      var marca = tupay ? 'tupay' : 'pasarela';
      if(r.pagable) T.db(marca, true); else if(r.motivo === 'sin-pasarela') T.db(marca, false);
      if(r.pagado) pagado(r.pago || {});
      else if(tupay && vuelta){ vuelta = false; confirmando(0); }                       // vuelve de Tupay: se comprueba cómo quedó el cobro
      else if(r.pagable) (tupay ? listoTupay(fallo ? 'Tupay no pudo completar el pago. Puede intentarlo de nuevo o elegir otro medio.' : '') : listo(''));
      else noPagable(r.motivo);
    });
  }

  if(!/^GD-\d{6}-\d{4}$/.test(n)){ n = ''; pedirDatos(''); }
  else if(!cel) pedirDatos('');
  else consultar(0);
})();
</script>
