<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<base href="/"><script>if(/\.github\.io$/.test(location.hostname))document.querySelector("base").href="/"+location.pathname.split("/")[1]+"/";window.addEventListener("click",function(e){if(e.defaultPrevented)return;var a=e.target.closest&&e.target.closest("a[href^='#']");if(a&&a.getAttribute("href").length>1){e.preventDefault();location.hash=a.getAttribute("href")}})</script>
<script src="js/gd-acceso.js?v=20261018a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizar pedido — Giandeco Studio Design</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A09">
<!-- favicon -->
<link rel="icon" href="favicon.ico?v=1" sizes="32x32">
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="site.webmanifest?v=1">
<!-- /favicon -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Jost:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/giandeco.css?v=20261026u">
<link rel="stylesheet" href="css/gd-tienda.css?v=20261028q">
<link rel="stylesheet" href="css/gd-tema.css?v=20261026r">
<script src="js/gd-tema.js?v=20261018a"></script>
</head>
<!-- data-home: el checkout no lleva el menú del sitio. Tiene su propia cabecera,
     sin nada que distraiga de terminar la compra. -->
<body data-home="true" class="co-body">

<header class="co-head">
  <a class="co-head-volver" href="catalogo/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg>Seguir viendo</a>
  <a class="co-head-logo" href="./" aria-label="Giandeco Studio Design"><img src="img/logo-negativo.svg" alt="Giandeco Studio Design"></a>
  <span class="co-head-seguro"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Compra segura</span>
</header>

<main class="co-top"><div class="gd-in" id="co"></div></main>

<footer class="co-foot">
  <a href="ayuda/compra-segura" target="_blank">Compra segura</a>
  <a href="ayuda/envios-y-entregas" target="_blank">Envíos</a>
  <a href="ayuda/cambios-y-garantia" target="_blank">Cambios y garantía</a>
  <a href="legal/terminos-y-condiciones" target="_blank">Términos</a>
  <a href="legal/politica-de-privacidad" target="_blank">Privacidad</a>
  <a href="legal/libro-de-reclamaciones" target="_blank">Libro de reclamaciones</a>
</footer>

<script src="js/giandeco.js?v=20261028a"></script>
<script src="js/gd-tienda.js?v=20261028q"></script>
<script src="js/gd-pago.js?v=20261018a"></script>
<script src="js/gd-ubigeo.js?v=20261018a"></script>
<script>
(function(){
  var T = window.GD_TIENDA, esc = T.esc, C = T.CFG, P = window.GD_PAGO;
  var root = document.getElementById('co');
  var qs = new URLSearchParams(location.search), ok = qs.get('ok'), dep = qs.get('dep') === '1';

  /* ==================== PEDIDO REGISTRADO ==================== */
  if(ok){
    var ped = T.pedidos.get(ok);
    if(!ped){ location.replace('cuenta#pedidos'); return; }
    var cot = !ped.subtotal;
    root.innerHTML = '<div class="co-ok">' +
      '<p class="gd-eyebrow">' + (cot ? 'Cotización registrada' : 'Pedido registrado') + '</p>' +
      '<h1>Gracias, ' + esc(ped.cliente.nombre.split(' ')[0]) + '</h1>' +
      '<p class="co-ok-n">' + esc(ped.n) + '</p>' +
      ((ped.pagoKey === 'directo' || dep) && !cot && !ped.pagado
        ? '<p class="co-lead">Su pedido quedó registrado. Para confirmarlo, pague con cualquiera de los medios de Giandeco y envíenos el comprobante.</p>' + T.pagoDirectoHTML(ped) + '<ol class="co-pasos" hidden>'
        : '<p class="co-lead">Su ' + (cot ? 'solicitud' : 'pedido') + ' quedó registrado. Confírmelo con Giandeco por WhatsApp: el mensaje ya está redactado con las piezas, la entrega y sus datos.</p>' +
          '<div class="co-ok-acc"><a class="gd-btn gd-btn-primary" href="' + T.wa(T.pedidos.mensaje(ped)) + '" target="_blank" rel="noopener">Confirmar por WhatsApp' + T.FLECHA + '</a></div>' +
          '<ol class="co-pasos">') +
        '<li><b>Usted confirma el pedido</b>Con un mensaje al WhatsApp oficial de Giandeco.</li>' +
        '<li><b>Giandeco responde</b>Disponibilidad, ' + (ped.entrega.porAgencia ? 'agencia de despacho' : 'costo de envío') + (ped.entrega.armado ? ', armado' : '') + ' y fecha de entrega.</li>' +
        (cot ? '<li><b>Recibe la cotización</b>Con el detalle por pieza y las condiciones.</li>'
             : '<li><b>Usted paga</b>' + esc(ped.pago) + '. Recibe su comprobante electrónico en ' + esc(ped.cliente.email) + '.</li>') +
        '<li><b>' + (ped.entrega.tipo === 'recojo' ? 'Recoge en Giandeco' : ped.entrega.destino === 'oficina' ? 'Recoge en la oficina de la agencia' : 'Recibe en su dirección') + '</b>' + esc(ped.entrega.resumen) + '</li>' +
      '</ol>' +
      '<div class="co-ok-acc">' + (!cot && !ped.pagado && P.activa() ? '<a class="gd-btn gd-btn-ghost" href="pagar?n=' + encodeURIComponent(ped.n) + '">Pagar en línea</a>' : '') +
        '<a class="gd-btn gd-btn-ghost" href="cuenta#pedidos">Ver mis pedidos</a>' +
        '<a class="gd-link" href="seguimiento?n=' + encodeURIComponent(ped.n) + '" style="align-self:center;">Seguir este pedido' + T.FLECHA + '</a></div></div>' +
      '<section class="gdt-sec" style="margin-top:var(--sp-64);"><div class="gdt-sec-head"><div><p class="gd-eyebrow">Selección Giandeco</p><h2 class="gd-h2">Para seguir armando el ambiente</h2></div></div>' +
        '<div class="gd-grid">' + T.recomendados(4).map(function(k){ return T.card(k); }).join('') + '</div></section>';
    return;
  }

  /* ==================== SELECCIÓN VACÍA ==================== */
  var lineas = T.carrito.lineas();
  if(!lineas.length){
    root.innerHTML = '<h1>Su bolsa está vacía</h1>' +
      '<p class="co-lead">Añada piezas del catálogo o toque un punto sobre la foto de un espacio para empezar.</p>' +
      '<div class="co-ok-acc"><a class="gd-btn gd-btn-primary" href="catalogo/">Ver el catálogo' + T.FLECHA + '</a>' +
      '<a class="gd-btn gd-btn-ghost" href="catalogo/compra-espacio/">Compra el espacio</a></div>' +
      '<section class="gdt-sec" style="margin-top:var(--sp-64);"><div class="gdt-sec-head"><div><p class="gd-eyebrow">Selección Giandeco</p><h2 class="gd-h2">Por dónde empezar</h2></div></div>' +
        '<div class="gd-grid">' + T.recomendados(4).map(function(k){ return T.card(k); }).join('') + '</div></section>';
    return;
  }

  /* ==================== COMPRA POR PASOS ==================== */
  var tot = T.carrito.total(lineas), soloCot = !tot.subtotal;
  var ses = T.sesion.get() || {}, datos = T.db('datos') || {};
  // tres pasos: el pago se elige en el mismo paso en que se confirma, sin una pantalla solo para eso
  var PASOS = soloCot ? ['Sus datos', 'Entrega', 'Confirmar'] : ['Sus datos', 'Entrega', 'Pago'];
  var ULT = PASOS.length - 1;
  /* dirección normalizada con el UBIGEO del INEI (js/gd-ubigeo.js):
     departamento → provincia → distrito, y el código de 6 dígitos va con el pedido */
  var UB = window.GD_UBIGEO || [];
  function ubDep(c){ return UB.filter(function(d){ return d[0] === c; })[0]; }
  function ubProv(c){ var d = ubDep(c.slice(0, 2)); return d ? d[2].filter(function(p){ return p[0] === c; })[0] : null; }
  function ubDist(c){ var p = ubProv(c.slice(0, 4)); return p ? p[2].filter(function(x){ return x[0] === c; })[0] : null; }
  var ubInicial = datos.ubigeo && ubDist(datos.ubigeo) ? datos.ubigeo : '';
  function opciones(lista, elegido, vacio){
    return (vacio ? '<option value="">' + vacio + '</option>' : '') +
      lista.map(function(x){ return '<option value="' + x[0] + '"' + (x[0] === elegido ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('');
  }
  function selUb(id, label, err){
    return '<div class="gd-field"><label for="' + id + '">' + label + '</label><select id="' + id + '" autocomplete="off"></select><span class="gdt-err">' + err + '</span></div>';
  }
  function v(x){ return esc(x || ''); }
  function campo(id, label, attrs, err, val){
    return '<div class="gd-field"><label for="' + id + '">' + label + '</label><input id="' + id + '" ' + attrs + ' value="' + v(val) + '"><span class="gdt-err">' + err + '</span></div>';
  }
  function lista(id, label, ops, val){
    return '<div class="gd-field"><label for="' + id + '">' + label + '</label><select id="' + id + '">' +
      ops.map(function(o){ return '<option' + (o === val ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>';
  }
  function opcion(name, value, titulo, nota, on, marcas, logos, off){
    return '<label class="gdt-op' + (logos ? ' con-logos' : '') + (off ? ' es-off' : '') + '"><input type="radio" name="' + name + '" value="' + value + '"' + (on ? ' checked' : '') + (off ? ' disabled' : '') + '><span><b>' + titulo + '</b>' +
      (logos ? T.logosPago(logos) : marcas ? '<em>' + marcas + '</em>' : '') + (nota ? '<small>' + nota + '</small>' : '') + '</span></label>';
  }
  function pie(i){
    return '<div class="co-nav">' + (i ? '<button type="button" class="co-atras" data-ir="' + (i - 1) + '">Volver</button>' : '<span></span>') +
      (i < ULT ? '<button type="button" class="gd-btn gd-btn-primary" data-sigue>Continuar' + T.FLECHA + '</button>'
               : '<button type="submit" class="gd-btn gd-btn-primary">' + (soloCot ? 'Enviar solicitud' : 'Registrar pedido') + T.FLECHA + '</button>') + '</div>';
  }
  var hayCupones = Object.keys(C.CUPONES || {}).length > 0;

  var pasoDatos =
    '<section class="co-paso" data-paso="0"><h2 class="co-paso-t">¿A nombre de quién va el pedido?</h2><div class="gd-form">' +
      campo('coNombre', 'Nombres y apellidos', 'type="text" autocomplete="name" required', 'Indique nombres y apellidos.', ses.nombre) +
      '<div class="gd-form gd-form-2">' +
        campo('coCel', 'Celular', 'type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="9" placeholder="9XX XXX XXX" required', 'Celular de 9 dígitos que empiece en 9.', ses.cel) +
        campo('coEmail', 'Correo', 'type="email" autocomplete="email" required', 'Revise el correo.', ses.email) +
      '</div>' +
      '<p class="co-etq">Comprobante de pago</p>' +
      '<div class="gdt-ops en-fila">' + opcion('comp', 'boleta', 'Boleta', 'Persona natural', datos.comp !== 'factura') + opcion('comp', 'factura', 'Factura', 'Empresa con RUC', datos.comp === 'factura') + '</div>' +
      '<div class="co-sub gd-form gd-form-2" data-si="comp=boleta">' +
        lista('coTdoc', 'Tipo de documento', ['DNI', 'Carné de extranjería', 'Pasaporte'], datos.tdoc) +
        campo('coDoc', 'Número de documento', 'type="text" maxlength="12" autocomplete="off"', 'Revise el número: el DNI tiene 8 dígitos.', datos.doc) +
      '</div>' +
      '<div class="co-sub gd-form" data-si="comp=factura">' +
        '<div class="gd-form gd-form-2">' +
          campo('coRuc', 'RUC', 'type="text" inputmode="numeric" maxlength="11"', 'El RUC tiene 11 dígitos y empieza en 10 o 20.', datos.ruc) +
          campo('coRazon', 'Razón social', 'type="text" autocomplete="organization"', 'Indique la razón social.', datos.razon) +
        '</div>' +
        campo('coFiscal', 'Dirección fiscal', 'type="text"', 'Indique la dirección fiscal.', datos.fiscal) +
      '</div>' +
    '</div>' + pie(0) + '</section>';

  var pasoEntrega =
    '<section class="co-paso" data-paso="1" hidden><h2 class="co-paso-t">¿Cómo lo recibe?</h2><div class="gd-form">' +
      '<div class="gdt-ops">' +
        opcion('ent', 'envio', 'Envío', esc(C.AGENCIA.nota), datos.ent !== 'recojo' || !C.RECOJO.activo) +
        (C.RECOJO.activo ? opcion('ent', 'recojo', 'Recojo en ' + esc(C.RECOJO.lugar), esc(C.RECOJO.dir) + ' · sin costo.', datos.ent === 'recojo') : '') +
      '</div>' +
      '<div class="co-sub gd-form" data-si="ent=envio">' +
        '<div class="gd-form co-3">' +
          selUb('coDep', 'Departamento', 'Elija el departamento.') +
          selUb('coProv', 'Provincia', 'Elija la provincia.') +
          selUb('coDist', 'Distrito', 'Elija el distrito.') +
        '</div>' +
        '<p class="co-ubigeo" id="coUbigeo" aria-live="polite"></p>' +
        '<div class="co-sub" id="coAgBox">' +
          '<p class="co-etq">Entrega de la agencia</p>' +
          '<div class="gdt-ops en-fila">' + opcion('agdest', 'domicilio', 'En su domicilio', 'La agencia lo lleva a su dirección.', datos.agdest !== 'oficina') +
            opcion('agdest', 'oficina', 'En la oficina de la agencia', 'Usted lo recoge en la oficina que elija.', datos.agdest === 'oficina') + '</div>' +
          lista('coAgencia', 'Agencia de preferencia (opcional)', ['Sin preferencia'].concat(C.AGENCIA.lista, ['Otra (indíquela en la nota)']), datos.agencia || 'Sin preferencia') +
        '</div>' +
        campo('coDir', 'Dirección', 'type="text" autocomplete="street-address" placeholder="Avenida, calle o jirón, número, dpto. o interior"', 'Indique la dirección de entrega.', datos.dir) +
        campo('coRef', 'Referencia', 'type="text" placeholder="Frente al parque, a una cuadra de…"', 'Una referencia ayuda a que el reparto llegue.', datos.ref) +
      '</div>' +
      '<label class="gdt-check"><input type="checkbox" id="coOtro"><span id="coOtroT">Recibirá el pedido otra persona.</span></label>' +
      '<div class="co-sub gd-form gd-form-2" id="coOtroBox" hidden>' +
        campo('coOtroN', 'Nombre de quien recibe', 'type="text"', 'Indique el nombre.', '') +
        campo('coOtroD', 'Su documento (DNI o CE)', 'type="text" maxlength="12"', 'Indique el documento.', '') +
      '</div>' +
      '<label class="gdt-check"><input type="checkbox" id="coArmado"><span>Quiero que Giandeco cotice el armado o la instalación.</span></label>' +
    '</div>' + pie(1) + '</section>';

  var pasoFinal =
    '<section class="co-paso" data-paso="' + ULT + '" hidden><h2 class="co-paso-t">' + (soloCot ? 'Revise y confirme' : '¿Cómo prefiere pagar?') + '</h2>' +
      (soloCot ? '' : '<div id="coPago"></div><p class="co-etq co-etq-rev">Su pedido</p>') +
      '<dl class="co-rev" id="coRev"></dl>' +
      '<details class="co-nota"><summary>Añadir una nota para Giandeco <span>(opcional)</span></summary>' +
        '<div class="gd-field"><label for="coNota">Nota para Giandeco</label><textarea id="coNota" style="min-height:88px;" placeholder="Fecha en que lo necesita, piso o acceso del inmueble, si es un regalo…"></textarea></div></details>' +
      '<label class="gdt-check"><input type="checkbox" id="coAcepto"><span>He leído y acepto los <a href="' + C.LEGAL.terminos + '" target="_blank">términos y condiciones</a> y la <a href="' + C.LEGAL.privacidad + '" target="_blank">política de privacidad</a>.</span></label>' +
      '<span class="gdt-err" id="coAceptoErr">Marque la casilla para continuar.</span>' +
      '<label class="gdt-check" style="margin-top:12px;"><input type="checkbox" id="coPromo"><span>Quiero recibir novedades y campañas de Giandeco (opcional).</span></label>' +
      pie(ULT) + '</section>';

  root.innerHTML =
    '<ol class="co-ruta" id="coRuta">' + PASOS.map(function(p, i){ return '<li data-ir="' + i + '"><i>' + (i + 1) + '</i><span>' + p + '</span></li>'; }).join('') + '</ol>' +
    // teléfono: el resumen queda debajo del formulario; esta barra muestra el total en cada paso y lleva a él
    '<button type="button" class="co-mini" id="coMini" aria-controls="coRes"><span>Su bolsa · ' + lineas.reduce(function(a, x){ return a + x.qty; }, 0) + (lineas.reduce(function(a, x){ return a + x.qty; }, 0) === 1 ? ' pieza' : ' piezas') + '</span><b id="coMiniTot"></b><em>Ver detalle</em></button>' +
    '<form class="co-grid" id="coForm" novalidate>' +
    '<div>' + pasoDatos + pasoEntrega + pasoFinal + '</div>' +
    '<aside class="co-res" id="coRes" aria-label="Resumen">' +
      '<h2>Su bolsa</h2><ul class="gdt-lines">' + lineas.map(function(x){
        return '<li class="gdt-line">' + (x.img ? '<span class="gdt-line-img"><img decoding="async" src="' + esc(x.img) + '" alt=""></span>' : '<span class="gdt-line-img is-vacia" aria-hidden="true">G</span>') +
          '<div class="gdt-line-body"><span class="gdt-line-cat">' + esc(x.cat) + '</span><span class="gdt-line-name">' + esc(x.nombre) + '</span>' +
          '<div class="gdt-line-row"><span class="gdt-qty"><b>' + x.qty + '</b></span><span class="gdt-line-price">' + (x.valor === null ? 'A cotizar' : T.fmt(x.valor * x.qty)) + '</span></div></div></li>';
      }).join('') + '</ul>' +
      (hayCupones && !soloCot ? '<div class="co-cupon"><input id="coCupon" type="text" placeholder="Código de descuento" aria-label="Código de descuento" autocomplete="off"><button type="button" id="coCuponBtn">Aplicar</button></div><p class="gdt-err" id="coCuponMsg" style="margin:0 0 8px;"></p>' : '') +
      '<dl class="co-tot" id="coTot"></dl>' +
      '<p class="co-res-nota"><a href="#" data-gdt-abrir style="color:var(--text-dim);">Editar la bolsa</a></p>' +
      '<ul class="co-conf">' +
        '<li id="coConfPago"></li>' +
        '<li>Boleta o factura electrónica a su correo.</li>' +
        '<li>Atención directa de Giandeco por WhatsApp.</li>' +
      '</ul>' +
    '</aside>' +
    '</form>';

  var form = document.getElementById('coForm');
  // la nota del envío cambia con la zona (agencia o tarifa del estudio)
  var notaEnvio = form.querySelector('input[name="ent"][value="envio"]').closest('label').querySelector('small');
  if(notaEnvio) notaEnvio.id = 'coEntNota';
  function $(id){ return document.getElementById(id); }
  function g(id){ var el = $(id); return el ? el.value.trim() : ''; }
  function radio(n){ var r = form.querySelector('input[name="' + n + '"]:checked'); return r ? r.value : ''; }

  function zonaKey(){
    var dep = g('coDep'), prov = g('coProv');
    if(dep === '07') return 'callao';
    if(prov === '1501') return 'lima';           // Lima Metropolitana = provincia de Lima
    return 'provincia';
  }
  /* sin tarifa propia en la zona: va por agencia y el flete lo paga el cliente */
  function porAgencia(){ return radio('ent') === 'envio' && zona().tarifa == null; }
  function nombreUb(id){ var el = $(id); return el && el.value ? el.options[el.selectedIndex].text : ''; }
  function pintarUbigeo(nivel){
    var dep = $('coDep'), prov = $('coProv'), dist = $('coDist');
    if(nivel <= 0){ dep.innerHTML = opciones(UB.map(function(d){ return [d[0], d[1]]; }), dep.value || (ubInicial ? ubInicial.slice(0, 2) : '15')); }
    if(nivel <= 1){
      var d = ubDep(dep.value), pv = prov.value || (ubInicial ? ubInicial.slice(0, 4) : '1501');
      if(!d || pv.slice(0, 2) !== dep.value) pv = d && d[2].length === 1 ? d[2][0][0] : '';
      prov.innerHTML = opciones(d ? d[2].map(function(p){ return [p[0], p[1]]; }) : [], pv, 'Elija la provincia');
    }
    var p = ubProv(prov.value || '----'), dv = dist.value || ubInicial;
    if(!p || dv.slice(0, 4) !== prov.value) dv = '';
    dist.innerHTML = opciones(p ? p[2] : [], dv, p ? 'Elija el distrito' : 'Elija primero la provincia');
    dist.disabled = !p;
    ubInicial = '';
    $('coUbigeo').textContent = dist.value ? 'UBIGEO ' + dist.value + ' · ' + nombreUb('coDist') + ', ' + nombreUb('coProv') + ', ' + nombreUb('coDep') : '';
  }
  function zona(){ var k = zonaKey(); return C.ENVIO.filter(function(z){ return z.key === k; })[0]; }

  /* medios de pago: solo dos, en línea y directo. Sin pasarela activa, el pago en línea
     se muestra apagado (no se ofrece un pago que no se puede hacer). */
  function usable(m){ return m.key !== 'culqi' || pasarela; }
  var pagoTocado = false;   // lo que el cliente eligió manda; si no eligió, se propone el último medio usado o el primero disponible
  function pintarPago(){
    var host = $('coPago'); if(!host) return;
    var ops = C.PAGO.filter(function(m){ return m.activo; }), antes = pagoTocado ? radio('pago') : datos.pago;
    var elegido = ops.filter(function(m){ return usable(m) && m.key === antes; })[0] || ops.filter(usable)[0];
    host.innerHTML = ops.length ? '<div class="gdt-ops co-pagos">' + ops.map(function(m){
        return opcion('pago', m.key, m.label, usable(m) ? m.nota : m.notaOff, !!elegido && m.key === elegido.key, null, m.logos, !usable(m));
      }).join('') + '</div>' +
      (pasarela && ops.some(function(m){ return m.key === 'culqi'; }) ? CONFIANZA : '')
      : '<p class="co-ayuda">Giandeco le escribirá por WhatsApp para coordinar el pago.</p>';
    botonFinal(); textosPago();
  }
  /* por qué pagar aquí es seguro: solo hechos que la pasarela respalda */
  var CONFIANZA = '<p class="co-seguro"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>' +
    '<span>Pago procesado por una pasarela certificada PCI DSS. Giandeco no ve ni guarda los datos de su tarjeta.</span></p>';
  /* el último botón dice lo que va a pasar */
  function botonFinal(){
    var b = form.querySelector('.co-paso[data-paso="' + ULT + '"] button[type="submit"]'); if(!b || soloCot) return;
    b.innerHTML = (enLinea(pagoElegido()) ? 'Continuar al pago' : 'Registrar pedido') + T.FLECHA;
  }
  function pagoElegido(){ var k = radio('pago'); return C.PAGO.filter(function(m){ return m.key === k; })[0]; }

  /* pasarela: con ella, tarjeta, cuotas y Yape se pagan en línea al registrar el pedido */
  var pasarela = P.activa();
  function enLinea(m){ return pasarela && !!m && P.EN_LINEA.indexOf(m.key) !== -1; }
  function textosPago(){
    var b = $('coConfPago'), m = pagoElegido();
    if(b) b.textContent = soloCot ? 'Sin cobro: primero recibe la cotización.' : m && m.key === 'culqi' ? 'Pago en línea protegido.' : 'Confirmamos su pedido al recibir el comprobante.';
  }
  P.estado().then(function(a){ if(a !== pasarela){ pasarela = a; textosPago(); pintarPago(); } });

  var cupon = null;
  function descuento(){
    if(!cupon) return 0;
    var c = C.CUPONES[cupon];
    return Math.min(tot.subtotal, c.pct ? tot.subtotal * c.pct / 100 : (c.monto || 0));
  }
  function totales(){
    var ent = radio('ent'), z = zona();
    var agencia = porAgencia(), envio = ent === 'recojo' || agencia ? 0 : z.tarifa, pend = envio === null, desc = descuento();
    var h = '<div><dt>Subtotal</dt><dd>' + (soloCot ? 'A cotizar' : T.fmt(tot.subtotal)) + '</dd></div>';
    if(desc) h += '<div><dt>Cupón ' + esc(cupon) + '</dt><dd>− ' + T.fmt(desc) + '</dd></div>';
    if(tot.cotizar && !soloCot) h += '<div><dt>' + tot.cotizar + (tot.cotizar === 1 ? ' pieza' : ' piezas') + ' a cotizar</dt><dd>Lo confirma Giandeco</dd></div>';
    h += '<div><dt>' + (ent === 'recojo' ? 'Recojo en Giandeco' : agencia ? 'Envío por agencia' : 'Envío · ' + z.label) + '</dt><dd>' +
      (agencia ? 'A cargo del cliente' : pend ? 'Lo confirma Giandeco' : envio ? T.fmt(envio) : 'Sin costo') + '</dd></div>';
    if($('coArmado').checked) h += '<div><dt>Armado / instalación</dt><dd>Lo cotiza Giandeco</dd></div>';
    if(!soloCot){
      var total = tot.subtotal - desc + (envio || 0);
      h += '<div class="es-total"><dt>' + (pend || tot.cotizar || $('coArmado').checked ? 'Total de piezas' : 'Total') + '</dt><dd>' + T.fmt(total) + '</dd></div>';
      if(C.PRECIOS_CON_IGV) h += '<div class="es-igv"><dt>Incluye IGV (18 %)</dt><dd>' + T.fmt(total * 18 / 118) + '</dd></div>';
      if(agencia) h += '<div class="es-igv"><dt>El flete se paga a la agencia al recibir o recoger.</dt><dd></dd></div>';
    }
    $('coTot').innerHTML = h;
    $('coMiniTot').textContent = soloCot ? 'A cotizar' : T.fmt(tot.subtotal - desc + (envio || 0));
  }
  function entregaTexto(){
    return radio('ent') === 'recojo' ? 'Recojo en ' + C.RECOJO.lugar + ' — ' + C.RECOJO.dir
      : g('coDir') + ', ' + nombreUb('coDist') + ', ' + nombreUb('coProv') + ', ' + nombreUb('coDep') + ' (UBIGEO ' + g('coDist') + ') · Ref.: ' + g('coRef') +
        (porAgencia() ? ' · Por agencia, a cargo del cliente · ' + (radio('agdest') === 'oficina' ? 'Recoge en oficina de la agencia' : 'Entrega en domicilio') +
          (g('coAgencia') !== 'Sin preferencia' ? ' · Agencia: ' + g('coAgencia') : '') : '');
  }
  function revision(){
    var comp = radio('comp');
    var f = [['Datos', esc(g('coNombre')) + '<br>' + esc(g('coCel')) + ' · ' + esc(g('coEmail')) + '<br>' +
                (comp === 'boleta' ? 'Boleta · ' + esc(g('coTdoc')) + ' ' + esc(g('coDoc')) : 'Factura · RUC ' + esc(g('coRuc')) + ' · ' + esc(g('coRazon'))), 0],
             ['Entrega', entregaTexto().split(' · ').map(esc).join('<br>') + ($('coOtro').checked ? '<br>Recibe: ' + esc(g('coOtroN')) : '') + ($('coArmado').checked ? '<br>Con cotización de armado' : ''), 1]];
    $('coRev').innerHTML = f.map(function(x){ return '<div><dt>' + x[0] + '</dt><dd>' + x[1] + '</dd><button type="button" data-ir="' + x[2] + '">Editar</button></div>'; }).join('');
  }
  function condicionales(){
    form.querySelectorAll('[data-si]').forEach(function(el){
      var c = el.getAttribute('data-si').split('=');
      el.hidden = radio(c[0]) !== c[1];
    });
    $('coOtroT').textContent = radio('ent') === 'recojo' ? 'Recogerá el pedido otra persona.' : 'Recibirá el pedido otra persona.';
    $('coOtroBox').hidden = !$('coOtro').checked;
    $('coAgBox').hidden = !porAgencia();
    var z = zona();
    $('coEntNota').textContent = z.tarifa == null ? C.AGENCIA.nota : 'Despacho a ' + z.label + ': ' + T.fmt(z.tarifa) + '.';
    $('coDir').placeholder = porAgencia() && radio('agdest') === 'oficina' ? 'Su dirección (para la guía de la agencia)' : 'Avenida, calle o jirón, número, dpto. o interior';
    pintarPago(); totales();
  }

  /* ---- validación, un paso a la vez ---- */
  function revisar(id, bien){ $(id).closest('.gd-field').classList.toggle('is-mal', !bien); return bien; }
  var VALIDA = [
    function(){
      var comp = radio('comp'), doc = g('coDoc');
      var r = [revisar('coNombre', g('coNombre').split(/\s+/).length >= 2), revisar('coCel', /^9\d{8}$/.test(g('coCel'))), revisar('coEmail', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(g('coEmail')))];
      if(comp === 'boleta') r.push(revisar('coDoc', g('coTdoc') === 'DNI' ? /^\d{8}$/.test(doc) : /^[A-Za-z0-9]{6,12}$/.test(doc)));
      else r.push(revisar('coRuc', /^(10|20)\d{9}$/.test(g('coRuc'))), revisar('coRazon', g('coRazon').length > 2), revisar('coFiscal', g('coFiscal').length > 5));
      return r.every(Boolean);
    },
    function(){
      var r = [];
      if(radio('ent') === 'envio') r.push(revisar('coDep', !!g('coDep')), revisar('coProv', !!g('coProv')), revisar('coDist', /^\d{6}$/.test(g('coDist'))), revisar('coDir', g('coDir').length > 5), revisar('coRef', g('coRef').length > 3));
      if($('coOtro').checked) r.push(revisar('coOtroN', g('coOtroN').length > 4), revisar('coOtroD', /^[A-Za-z0-9]{6,12}$/.test(g('coOtroD'))));
      return r.every(Boolean);
    }
  ];

  var actual = 0, hecho = 0;
  function mostrar(i){
    actual = i; hecho = Math.max(hecho, i);
    form.querySelectorAll('.co-paso').forEach(function(s){ s.hidden = +s.getAttribute('data-paso') !== i; });
    document.querySelectorAll('#coRuta li').forEach(function(li, k){
      li.classList.toggle('is-activo', k === i); li.classList.toggle('is-hecho', k < i); li.classList.toggle('es-alcanzable', k <= hecho);
      if(k === i) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
    });
    if(i === ULT) revision();
    var t = form.querySelector('.co-paso:not([hidden]) .co-paso-t');
    window.scrollTo(0, 0); if(t){ t.setAttribute('tabindex', '-1'); t.focus({ preventScroll:true }); }
  }
  function avanzar(){
    form.querySelectorAll('.is-mal').forEach(function(f){ f.classList.remove('is-mal'); });
    if(VALIDA[actual] && !VALIDA[actual]()){ var m = form.querySelector('.co-paso:not([hidden]) .is-mal :is(input, select)'); if(m) m.focus(); return; }
    mostrar(actual + 1);
  }
  root.addEventListener('click', function(e){
    if(e.target.closest('[data-sigue]')){ avanzar(); return; }
    var ir = e.target.closest('[data-ir]');
    if(ir){ var n = +ir.getAttribute('data-ir'); if(n <= hecho && n !== actual) mostrar(n); }
  });
  // Enter en un campo avanza de paso en vez de enviar el pedido a medias
  form.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.tagName === 'INPUT' && actual < ULT){ e.preventDefault(); avanzar(); }
  });

  function limpiarError(e){ var f = e.target.closest && e.target.closest('.gd-field.is-mal'); if(f) f.classList.remove('is-mal'); }
  form.addEventListener('input', limpiarError);
  form.addEventListener('change', function(e){
    limpiarError(e);
    if(e.target.id === 'coDep'){ $('coProv').value = ''; $('coDist').value = ''; pintarUbigeo(1); }
    else if(e.target.id === 'coProv'){ $('coDist').value = ''; pintarUbigeo(2); }
    else if(e.target.id === 'coDist') pintarUbigeo(2);
    if(e.target.name === 'pago'){ pagoTocado = true; botonFinal(); textosPago(); return; }
    condicionales();
  });
  $('coCel').addEventListener('input', function(){ this.value = this.value.replace(/\D/g, ''); });
  $('coMini').addEventListener('click', function(){ $('coRes').scrollIntoView({ behavior:'smooth', block:'start' }); });
  var cBtn = $('coCuponBtn');
  if(cBtn) cBtn.addEventListener('click', function(){
    var k = g('coCupon').toUpperCase(), msg = $('coCuponMsg');
    cupon = C.CUPONES[k] ? k : null;
    msg.style.display = 'block'; msg.style.color = cupon ? 'var(--accent)' : '';
    msg.textContent = cupon ? 'Código aplicado.' : 'Ese código no es válido.';
    totales();
  });
  pintarUbigeo(0); condicionales(); textosPago(); mostrar(0);

  // si la selección cambia desde el cajón, el resumen se rehace entero
  var enviando = false;
  document.addEventListener('gd:carrito', function(){ if(!enviando) location.reload(); });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(actual < ULT){ avanzar(); return; }
    if(!VALIDA[0]()){ mostrar(0); return; }
    if(!VALIDA[1]()){ mostrar(1); return; }
    var acepto = $('coAcepto').checked;
    $('coAceptoErr').style.display = acepto ? '' : 'block';
    if(!acepto){ $('coAcepto').focus(); return; }

    var comp = radio('comp'), ent = radio('ent'), tdoc = g('coTdoc'), doc = g('coDoc'), z = zona(), pago = soloCot ? null : pagoElegido();
    // la pasarela pudo apagarse mientras la página estaba abierta: no se registra un pago que no se puede cobrar
    if(pago && !usable(pago)){ pintarPago(); $('coPago').scrollIntoView({ block:'center' }); return; }
    var entrega = ent === 'recojo'
      ? { tipo:'recojo', resumen:entregaTexto() }
      : { tipo:'envio', zona:z.key, ubigeo:g('coDist'), departamento:nombreUb('coDep'), provincia:nombreUb('coProv'), distrito:nombreUb('coDist'),
          dir:g('coDir'), ref:g('coRef'), porAgencia:porAgencia(), destino:porAgencia() ? radio('agdest') : 'domicilio',
          agencia:porAgencia() && g('coAgencia') !== 'Sin preferencia' ? g('coAgencia') : '',
          resumen:'Envío a ' + entregaTexto() };
    entrega.armado = $('coArmado').checked;
    if($('coOtro').checked) entrega.recibe = g('coOtroN') + ' (doc. ' + g('coOtroD') + ')';

    var desc = descuento();
    var ped = T.pedidos.crear({
      items: lineas, subtotal: tot.subtotal, cotizar: tot.cotizar, entrega: entrega,
      pago: pago ? pago.label : '', pagoKey: pago ? pago.key : '', nota: g('coNota'), cupon: cupon || '', descuento: desc,
      promo: $('coPromo').checked,
      comprobante: comp === 'boleta' ? { tipo:'boleta', resumen:'Boleta · ' + tdoc + ' ' + doc }
                                     : { tipo:'factura', resumen:'Factura · RUC ' + g('coRuc') + ' · ' + g('coRazon') + ' · ' + g('coFiscal') },
      cliente: { nombre:g('coNombre'), cel:g('coCel'), email:g('coEmail') }
    });
    // la cuenta nace con el primer pedido: nadie se registra antes de comprar
    T.sesion.set({ nombre:g('coNombre'), cel:g('coCel'), email:g('coEmail') });
    T.db('datos', { comp:comp, tdoc:tdoc, doc:doc, ruc:g('coRuc'), razon:g('coRazon'), fiscal:g('coFiscal'), ent:ent,
                    ubigeo:g('coDist'), dir:g('coDir'), ref:g('coRef'), agdest:radio('agdest'), agencia:g('coAgencia'), pago:pago ? pago.key : '' });
    enviando = true;
    T.carrito.vaciar();
    // medio en línea: directo a pagar. Si el total aún depende del estudio, esa página lo explica.
    if(enLinea(pago)){ location.href = 'pagar?n=' + encodeURIComponent(ped.n); return; }
    if(!pago || pago.key !== 'directo') window.open(T.wa(T.pedidos.mensaje(ped)), '_blank', 'noopener');
    location.href = 'checkout?ok=' + encodeURIComponent(ped.n);
  });
})();
</script>
</body>
</html>
