<body data-mundo="catalogo" data-seccion="home">

<div id="gdHeader"></div>

<!-- ==================== BANNER: empieza bajo el header transparente ==================== -->
<section class="ctb" aria-label="Catálogo Giandeco">
  <div class="ctb-d">
    <div class="gd-shop">
      <img class="gd-shop-img" decoding="async" fetchpriority="high" src="images/campana/navidad-comedor-2026-1920.webp" srcset="images/campana/navidad-comedor-2026-1280.webp 1280w, images/campana/navidad-comedor-2026-1920.webp 1920w, images/campana/navidad-comedor-2026-2560.webp 2560w" sizes="100vw" width="1920" height="1072" alt="Comedor de Navidad ambientado por Giandeco con piezas reales de la colección 2026: portavelas dorados, reno recostado, bombonera casita, casa de jengibre, cascanueces musicales y reno con plato sobre el aparador; farol de 1.24 m y arreglo de pino y berries">
      <button class="gd-shop-dot" style="left:32.9%; top:39%" data-prod="farol-124"></button>
      <button class="gd-shop-dot" style="left:39.6%; top:47%" data-prod="portavela-dorado"></button>
      <button class="gd-shop-dot" style="left:45.6%; top:51.5%" data-prod="reno-recostado"></button>
      <button class="gd-shop-dot" style="left:51.6%; top:50%" data-prod="bombonera-casita"></button>
      <button class="gd-shop-dot" style="left:58.1%; top:50%" data-prod="casa-jengibre"></button>
      <button class="gd-shop-dot" style="left:65%; top:49%" data-prod="cascanueces-musicales"></button>
      <button class="gd-shop-dot" style="left:71.8%; top:47%" data-prod="reno-de-pie-plato"></button>
      <button class="gd-shop-dot" style="left:39.1%; top:72%" data-prod="arreglo-pino-berries"></button>
    </div>
  </div>
  <div class="ctb-m">
    <div class="gd-shop">
      <img class="gd-shop-img" decoding="async" src="images/campana/navidad-movil-2026-780.webp" srcset="images/campana/navidad-movil-2026-780.webp 780w, images/campana/navidad-movil-2026-1280.webp 1280w" sizes="100vw" width="1280" height="964" alt="Aparador navideño con bombonera casita, casa de jengibre, cascanueces musicales y reno dorado con plato de la colección Navidad 2026">
      <button class="gd-shop-dot" style="left:20.4%; top:56%" data-prod="bombonera-casita"></button>
      <button class="gd-shop-dot" style="left:48.6%; top:49%" data-prod="casa-jengibre"></button>
      <button class="gd-shop-dot" style="left:71.8%; top:49%" data-prod="cascanueces-musicales"></button>
      <button class="gd-shop-dot" style="left:89.6%; top:47%" data-prod="reno-de-pie-plato"></button>
    </div>
    <p class="ctb-tip">Toque un punto para ver la pieza</p>
  </div>
  <div class="ctb-shade"></div>
  <div class="ctb-txt"><div class="gd-in">
    <p class="ctb-eyebrow">Catálogo · Campaña Navidad 2026</p>
    <h1>Lo que montamos, <em>a la venta</em></h1>
    <div class="ctb-cta">
      <a class="gd-btn gd-btn-primary" href="#piezas"><span data-cat-total data-pre="Ver las " data-post=" piezas">Ver todas las piezas</span></a>
      <a class="gd-btn gd-btn-ghost" href="catalogo-navidad">Colección Navidad</a>
    </div>
  </div></div>
</section>

<!-- ==================== CATÁLOGO CON FILTROS (lo arma js/gd-catalogo.js) ==================== -->
<div id="gdCat" data-linea="todo"></div>

<!-- bloque editorial que entra en la grilla después de la 8.ª pieza (precios y total salen del catálogo) -->
<template id="gdCatEditorial">
  <div id="aparador" class="ctl-ed">
    <div class="ctl-ed-img"><img loading="lazy" decoding="async" src="images/campana/navidad-comedor-2026-1280.webp" alt="Aparador navideño con seis piezas de la colección 2026"></div>
    <div class="ctl-ed-body">
      <p class="ctl-ed-k">Visto en el banner</p>
      <h2>El aparador completo</h2>
      <ol data-ed-keys="portavela-dorado,reno-recostado,bombonera-casita,casa-jengibre,cascanueces-musicales,reno-de-pie-plato"></ol>
      <button type="button" class="gd-btn gd-btn-primary" data-act="set-aparador" data-keys="portavela-dorado,reno-recostado,bombonera-casita,casa-jengibre,cascanueces-musicales,reno-de-pie-plato" data-wa="https://wa.me/51920775559?text=Hola%20Giandeco%2C%20quiero%20el%20aparador%20completo%20de%20Navidad%202026."><span data-ed-total data-pre="Añadir las 6 piezas · ">Añadir las 6 piezas · S/ 510.60</span></button>
    </div>
  </div>
</template>
